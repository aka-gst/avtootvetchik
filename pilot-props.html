<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ТЕХНОМАГИЯ — пилоты предметов v2</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-content: center;
      gap: 12px;
      padding: 24px;
      background: #10131b;
      color: #c4d1d8;
      font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    h1 { margin: 0; color: #24dce6; font-size: 14px; letter-spacing: .08em; }
    p { margin: 0; color: #596474; }
    .frame { max-width: calc(100vw - 48px); overflow-x: auto; }
    #scene {
      position: relative;
      width: 480px;
      height: 192px;
      overflow: hidden;
      border: 1px solid #596474;
      background-color: #202633;
      background-repeat: repeat;
    }
    .pilot {
      position: absolute;
      width: 72px;
      height: 72px;
      object-fit: contain;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>ПИЛОТЫ ПРЕДМЕТОВ · V2</h1>
  <p>192→72 px · асфальт игры · без боевого маппинга</p>
  <div class="frame">
    <main id="scene" aria-label="Бочка, канистра и кристалл на полу ТехноМагии"></main>
  </div>
  <script type="module">
    import { createPilotPropsScene } from './src/pilot-props-scene.js';

    const data = createPilotPropsScene();
    const scene = document.querySelector('#scene');
    scene.style.width = `${data.width}px`;
    scene.style.height = `${data.height}px`;
    scene.style.backgroundImage = `url(${data.floor})`;
    scene.style.backgroundSize = `${data.tileSize}px ${data.tileSize}px`;

    for (const prop of data.props) {
      const image = new Image(data.spriteSize, data.spriteSize);
      image.className = 'pilot';
      image.alt = prop.id;
      image.src = prop.src;
      image.style.left = `${prop.x}px`;
      image.style.top = `${prop.y}px`;
      scene.append(image);
    }
  </script>
</body>
</html>
